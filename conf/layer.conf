# Layer configuration for meta-kodi, an OpenEmbedded application layer
# providing the Kodi media center and its supporting recipes.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-kodi"
BBFILE_PATTERN_meta-kodi := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-kodi = "6"

# core:              openembedded-core
# openembedded-layer: meta-openembedded/meta-oe (waylandpp, libtinyxml,
#                     libtinyxml2, libass, giflib, exiv2, nlohmann-json,
#                     libcec, libnfs, spdlog, flatbuffers, ...)
# multimedia-layer:  meta-openembedded/meta-multimedia (crossguid, dav1d,
#                    libao)
# meta-java:         openjdk-8-native, for the SWIG/Groovy interface
#                    codegen step
LAYERDEPENDS_meta-kodi = "core openembedded-layer multimedia-layer meta-java"

LAYERSERIES_COMPAT_meta-kodi = "wrynose"
